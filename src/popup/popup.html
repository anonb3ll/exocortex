<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Where Was I?</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 320px;
      padding: 14px;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
    }
    h3 {
      font-size: 1.05rem;
      margin-top: 0;
      margin-bottom: 12px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
    }
    .card-title {
      font-weight: 600;
      font-size: 0.92rem;
      color: #f1f5f9;
      margin: 0 0 6px 0;
      line-height: 1.3;
      word-break: break-word;
    }
    .card-meta {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .card-excerpt {
      font-size: 0.8rem;
      color: #cbd5e1;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .empty-state {
      font-size: 0.85rem;
      color: #94a3b8;
      text-align: center;
      padding: 16px 0;
    }
    a.link {
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 500;
    }
    a.link:hover {
      text-decoration: underline;
    }
    .open-sidepanel-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      box-sizing: border-box;
      margin-top: 10px;
      padding: 8px 12px;
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      gap: 6px;
    }
    .open-sidepanel-btn:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <h3>🧠 Where Was I?</h3>
  <div id="quick-context">
    <p class="empty-state">Loading last active context...</p>
  </div>
  <button id="open-sidepanel-btn" class="open-sidepanel-btn" type="button">Open Side Panel ◨</button>
  <script type="module" src="./popup.ts"></script>
</body>
</html>
