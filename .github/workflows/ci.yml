name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit identity check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash scripts/check_commit_identity.sh --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            bash scripts/check_commit_identity.sh --range "${{ github.event.before }}..${{ github.sha }}"
          else
            bash scripts/check_commit_identity.sh --range "${{ github.sha }}"
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      # Puppeteer's Chrome download runs in a lifecycle script, which bun only
      # executes for trustedDependencies (see package.json). Without a browser on
      # disk the B-layer cannot run at all.
      - name: Verify Chrome is present
        run: bunx puppeteer browsers install chrome

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build Extension
        run: bun run build

      # Must run AFTER the build: the manifest/artifact contract tests assert
      # against dist/. A green build is not the gate — it was green for four
      # phases while dist/content.js was unloadable in Chrome (task #168).
      #
      # Runs under xvfb so the real-browser (B*) layer actually executes. Without a
      # DISPLAY those 11 tests skip, and a skipped B-layer is not evidence the
      # extension loads — which is exactly how a manifest missing the "offscreen"
      # permission shipped with the whole embedding pipeline dead.
      - name: Test
        env:
          # Opt-in B-layer (see tests/fixtures/browser-launch.ts). xvfb supplies
          # a disposable display; never rely on a developer desktop DISPLAY.
          EXOCORTEX_BROWSER_TESTS: "1"
          EXOCORTEX_EMBEDDER_TESTS: "1"
        run: xvfb-run -a bun run test
